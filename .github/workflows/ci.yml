name: CI

# One job, `ci`, runs the full check on Node 24: the plugin's own typecheck, build, unit, conformance, host and pack
# suites, then `npx plugin-kit check`. It is the required status check on every pull request. Every step also runs
# locally: npm ci --ignore-scripts && npm run check.

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (vars.CI_RUNNER_PUBLIC || 'ubuntu-24.04') || 'ubuntu-24.04' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # actionlint parses the workflows as workflows, not as YAML: a `${{ }}` in a context that does not exist makes
      # GitHub reject the file and run nothing at all.
      - name: actionlint
        run: |
          set -euo pipefail
          version=1.7.12
          base="https://github.com/rhysd/actionlint/releases/download/v${version}"
          curl -sSfLO "${base}/actionlint_${version}_linux_amd64.tar.gz"
          curl -sSfLO "${base}/actionlint_${version}_checksums.txt"
          grep " actionlint_${version}_linux_amd64.tar.gz$" "actionlint_${version}_checksums.txt" | sha256sum -c -
          tar xzf "actionlint_${version}_linux_amd64.tar.gz" actionlint
          ./actionlint -color
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # Bun runs the tests: 1.4.4 is the Bun inside stock OpenCode 2.4.1.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
          no-cache: true
      - name: Fetch the contract over HTTPS
        # The contract is a public repository, and npm records its GitHub dependency over ssh. A runner has no key.
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - run: npm ci --ignore-scripts
      - run: npm run check
      # dist/ is committed, so a release tag installs with no build. The build must be the committed one.
      - name: dist/ is current
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain -- dist)" ]; then
            echo "::error::The committed dist/ is not what npm run build makes. Run npm run build and commit dist/."
            exit 1
          fi
